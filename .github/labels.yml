# Issue labels for every openlfcp repository (LFCP-002).
# Labels are not inherited from this repository: create them per repository,
# by hand or with a label-sync tool, once remotes exist.
# Format: list of {name, color (6-digit hex, no #), description}.

# Area: which part of the system.
- name: "area:protocol"
  color: "1d76db"
  description: "Protocol architecture across Wire and profiles"
- name: "area:wire"
  color: "1d76db"
  description: "LFCP-WIRE-01 encoding, messages and vectors"
- name: "area:crypto"
  color: "1d76db"
  description: "Signatures, AEAD, HPKE, key derivation"
- name: "area:control-plane"
  color: "1d76db"
  description: "Control Chain, capabilities, epochs, coordinator"
- name: "area:data-plane"
  color: "1d76db"
  description: "Data Units, Have Vectors, snapshots, sync"
- name: "area:profile"
  color: "1d76db"
  description: "Shared Objects Profile and other application profiles"
- name: "area:storage"
  color: "1d76db"
  description: "Client and server persistence"
- name: "area:server"
  color: "1d76db"
  description: "Reference LFCP server"
- name: "area:obsidian"
  color: "1d76db"
  description: "Obsidian adapter and product UI"
- name: "area:interop"
  color: "1d76db"
  description: "Cross-implementation conformance and vectors"
- name: "area:ci"
  color: "1d76db"
  description: "Build, validation and CI"

# Type: what kind of change.
- name: "type:feature"
  color: "0e8a16"
  description: "New capability"
- name: "type:test"
  color: "0e8a16"
  description: "Tests, vectors or fixtures"
- name: "type:docs"
  color: "0e8a16"
  description: "Documentation only"
- name: "type:infra"
  color: "0e8a16"
  description: "Tooling, CI, repository setup"
- name: "type:bug"
  color: "d73a4a"
  description: "Behavior that contradicts the specification or docs"

# Priority.
- name: "priority:p0"
  color: "b60205"
  description: "Blocks the MVP 0.1 critical path"
- name: "priority:p1"
  color: "fbca04"
  description: "Needed for MVP 0.1"
- name: "priority:p2"
  color: "c5def5"
  description: "Useful, not required for MVP 0.1"

# Status.
- name: "blocked"
  color: "000000"
  description: "Waiting on another issue or external input"
- name: "agent-ready"
  color: "5319e7"
  description: "Specified well enough for a coding agent to pick up"
- name: "needs-protocol-decision"
  color: "e99695"
  description: "Spec gap waiting for the project owner's decision"
